buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'}"
    }
}

apply plugin: 'com.android.library'
// AGP built-in Kotlin may already register the `kotlin` extension.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: "kotlin-android"
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace "com.pocketllm.pocketgit"
    compileSdkVersion getExtOrDefault('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion', 26)
        targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'

    def jgitVersion = '5.13.5.202508271544-r'
    api "org.eclipse.jgit:org.eclipse.jgit:${jgitVersion}"
    implementation("org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:${jgitVersion}") {
        exclude group: 'com.jcraft', module: 'jsch'
    }
    // Apache HttpClient transport: the only JGit path that allows a custom HttpClientBuilder (sslVerify=false).
    implementation "org.eclipse.jgit:org.eclipse.jgit.http.apache:${jgitVersion}"
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    // Maintained JSch fork: ed25519 / modern KEX, API-compatible with JGit's ssh.jsch.
    implementation 'com.github.mwiede:jsch:0.2.23'
    // JSch EdDSA backend (NOT Optional): since 0.2.2x the BouncyCastle path in com.jcraft.jsch.bc.* is the only
    // ed25519 implementation in the jar (the i2p-eddsa package is gone; the jce path needs Java 15+). Without
    // bcprov, KeyPair.genKeyPair(ED25519) and ed25519 key auth both throw
    // NoClassDefFoundError: org/bouncycastle/crypto/params/Ed25519PrivateKeyParameters.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // JGit 5.13 core logs through slf4j; NOP binding keeps logcat clean.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}
