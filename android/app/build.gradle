apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * react-native-config flavor → dotenv binding. Set BEFORE applying `dotenv.gradle` below —
 * that helper reads `project.ext.envConfigFiles` at apply-time inside `loadDotEnv()`.
 * ENVFILE env var (cross-env in npm scripts) still wins; this is the fallback for a bare
 * ./gradlew invocation so each flavor resolves to its own .env.
 */
project.ext.envConfigFiles = [
    dev: ".env.dev",
    github: ".env.github",
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["devDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    entryFile = file("../../" + (project.env.get("ENTRY_FILE") ?: "index.js"))
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Rule 32 (release signing strict): a release build must be signed with the real key, never
// silently fall back to debug.keystore. Release APKs are produced by CI (which materializes
// key.properties from GitHub Actions secrets); a local release invocation without it is an
// error, not a debug-signed APK masquerading as a release.
def requestedTaskNames = gradle.startParameter.taskNames.join(" ").toLowerCase()
def releaseBuildRequested = requestedTaskNames.contains("release")
if (releaseBuildRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException(
        "Release build requested but android/key.properties is absent.\n" +
        "Release APKs are packaging by GitHub Actions (tag github-<APP_VERSION>): the workflow " +
        "decrypts the signing key from secrets and writes a ephemeral key.properties before running " +
        "`npm run build:apk`.\n" +
        "To build a release locally, create android/key.properties with storeFile/storePassword/keyAlias/keyPassword. " +
        "Daily developer builds use `npm run android` (devDebug, debug-signed)."
    )
}


// Rule 32: resolve dotenv identity once, hand plain values to the productFlavors DSL
// (avoid calling versionCode/versionName with an inline expression per flavor).
def dotenvVersionCode = (project.env.get("APP_VERSION_CODE") ?: "4").toInteger()
def dotenvVersionName = project.env.get("APP_VERSION") ?: "1.0.3"
// Rule 32: launcher label = APP_NAME + per-flavor APP_LABEL_SUFFIX (dev "_dev", github empty).
// Appends only to the manifest app_name resValue; in-app brand/prompt/git author keep APP_NAME.
def dotenvAppLabel = (project.env.get("APP_NAME") ?: "CafebeeAI") + (project.env.get("APP_LABEL_SUFFIX") ?: "")

/**
 * Set this to true to run Proguard to obfuscate Java bytecode in Release builds.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing one to use methods like `Date.toLocaleString` and
 * `String.localeCompare` that give correct results for non-en-US locales.
 * Note that this variant is about 6MiB larger per architecture than the default one.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.github.luo3house.cafebeeai"
    defaultConfig {
        applicationId "io.github.luo3house.cafebeeai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Rule 32: versionName/versionCode source of truth = dotenv flavor file (see below flavors).
        // This default applies to config-evaluation-only (help/tasks), no flavor selected; kept for
        // safety, flavors always override.
        versionCode 1
        versionName "1.0"
        // react-native-config: expose env variables as BuildConfig fields.
        // NOTE: build_config_package stays as namespace, NOT current flavor's applicationId
        resValue "string", "build_config_package", "io.github.luo3house.cafebeeai"
    }
    // JGit / Apache HttpClient jars ship duplicated metadata resources (plugin.properties, META-INF/*).
    packaging {
        resources {
            pickFirsts += [
                "**/plugin.properties",
                "**/META-INF/DEPENDENCIES",
                "**/META-INF/LICENSE",
                "**/META-INF/LICENSE.txt",
                "**/META-INF/NOTICE",
                "**/META-INF/NOTICE.txt",
                "**/META-INF/MANIFEST.MF",
                "**/META-INF/INDEX.LIST",
                "**/overview.html",
                "**/about.html",
                // jsch + bcprov are multi-release jars: both ship META-INF/versions/**/OSGI-INF/MANIFEST.MF
                // and META-INF/versions/9/module-info.class (module metadata is meaningless on Android).
                "**/OSGI-INF/MANIFEST.MF",
                "**/module-info.class",
            ]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile keystorePropertiesFile.exists() ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }
    flavorDimensions "version"
    productFlavors {
        dev {
            dimension "version"
            isDefault true
            ndk { abiFilters "arm64-v8a" }
            // dotenv source of truth
            applicationId project.env.get("APP_ID") ?: "io.github.luo3house.cafebeeai.dev"
            versionCode dotenvVersionCode
            versionName dotenvVersionName
            resValue "string", "app_name", dotenvAppLabel
        }
        github {
            dimension "version"
            // Default not set (dev isDefault)
            ndk { abiFilters "arm64-v8a" }
            // dotenv source of truth
            applicationId project.env.get("APP_ID") ?: "io.github.luo3house.cafebeeai"
            versionCode dotenvVersionCode
            versionName dotenvVersionName
            resValue "string", "app_name", dotenvAppLabel
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
