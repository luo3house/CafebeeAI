name: Release Android APK

on:
  push:
    tags:
      - 'github-*'

jobs:
  release:
    name: Build & publish signed Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag github-<APP_VERSION> vs .env.github
        id: version_check
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^github-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$GITHUB_REF_NAME', expecting github-X.Y.Z"
            exit 1
          fi
          ver="${GITHUB_REF_NAME#github-}"
          env_ver="$(sed -n -e 's/^APP_VERSION=//p' .env.github)"
          if [ -z "$env_ver" ]; then
            echo "::error::.env.github missing APP_VERSION, cannot cross-check tag"
            exit 1
          fi
          if [ "$ver" != "$env_ver" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' mismatches .env.github APP_VERSION=$env_ver"
            echo "Rule 32 (dotenv = source of truth): edit APP_VERSION=$ver in .env.github and commit, then re-push the tag (and delete the old tag)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Tag + .env.github consistent: $ver"

      - name: Setup Node (engines >= 22.11.0)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Setup JDK 17 (AGP 8.12)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure NDK 27.1.12297006 (ubuntu-latest fallback)
        run: |
          ndkpath="$ANDROID_HOME/ndk/27.1.12297006"
          if [ -d "$ndkpath" ]; then
            echo "Using preinstalled $ndkpath"
          else
            echo "Installing NDK from cmdline-tools ($ANDROID_HOME)"
            # `yes` + pipefail = SIGPIPE 141 trap; ignore. sdkmanager is idempotent.
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" || true
            [ -d "$ndkpath" ] || { echo "::error::NDK 27.1.12297006 not at $ndkpath after install attempt"; exit 1; }
          fi

      - name: Install deps (frozen lockfile)
        run: npm ci

      - name: Quality gate (rule 32 / AGENTS.md)
        run: |
          npm run lint
          npm run tsc

      - name: Stamp APP_BUILD_AT (UTC now) into .env.github before gradle reads it
        run: |
          set -euo pipefail
          sed -i "s/^APP_BUILD_AT=.*/APP_BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)/" .env.github

      - name: Materialize release.keystore (gitignored) under android/app/
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Write android/key.properties (gitignored; storeFile = android/app/release.keystore)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret must be set in GitHub repo settings."
            exit 1
          fi
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KS_PASS" > android/key.properties
          echo "Configured key.properties; storeFile path relative to android/app."

      - name: Build signed github-flavor APK (android/app -> assembleGithubRelease, arm64-v8a)
        run: npm run build:apk

      - name: Verify APK signature (must be release-signed, not debug)
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/github/release/app-github-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::APK expected at $apk not found"
            ls -l android/app/build/outputs/apk/github/release/ 2>&1 || true
            exit 1
          fi
          # minSdk 26 ⇒ only v2/v3, so keytool -printcert -jarfile shows nothing. Use apksigner from build-tools.
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$AS" ]; then
            echo "WARN: apksigner not found under \$ANDROID_HOME/build-tools; skip signature print"
          else
            "$AS" verify --print-certs "$apk"
          fi

      - name: Publish GitHub release and upload APK asset
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/github/release/app-github-release.apk"
          # Rule 32: artifact naming follows dotenv APP_NAME (single source of truth)
          app_name="$(sed -n -e 's/^APP_NAME=//p' .env.github)"
          app_name="${app_name:-CafebeeAI}"
          renamed="${app_name}-${VERSION}-arm64-v8a.apk"
          cp "$apk" "$renamed"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists (re-run / retry path); uploading asset"
            gh release upload "$GITHUB_REF_NAME" "$renamed" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "${app_name} $VERSION" \
              --target "$GITHUB_SHA" \
              --latest
            gh release upload "$GITHUB_REF_NAME" "$renamed" --clobber
          fi
          echo
          echo "Final release:"
          gh release view "$GITHUB_REF_NAME"
