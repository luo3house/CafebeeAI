name: Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if the release already has uploaded assets'
        required: false
        default: 'false'
        type: boolean

# Serialize runs: 1 running + latest pending wins; older pending runs are cancelled
# by GitHub (decision: rapid main pushes may skip intermediate versions).
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to build
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      need_build: ${{ steps.check.outputs.need_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Manual dispatch is only allowed from main (got '$GITHUB_REF_NAME')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read APP_VERSION from .env.github
        id: version
        run: |
          set -euo pipefail
          if [ ! -f .env.github ]; then
            echo "::error::.env.github not found; cannot determine release version"
            exit 1
          fi
          env_ver="$(sed -n -e 's/^APP_VERSION=//p' .env.github)"
          if [ -z "$env_ver" ]; then
            echo "::error::.env.github missing APP_VERSION; cannot determine release version"
            exit 1
          fi
          if [[ ! "$env_ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APP_VERSION '$env_ver' in .env.github is not X.Y.Z"
            exit 1
          fi
          echo "version=$env_ver" >> "$GITHUB_OUTPUT"
          echo "tag=github-$env_ver" >> "$GITHUB_OUTPUT"

      - name: Check release assets for the version
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          force="false"
          if [ "$FORCE_INPUT" = "true" ]; then force="true"; fi
          if [ "$force" = "true" ]; then
            echo "Force requested; need build"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rel_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [ -z "$rel_json" ]; then
            echo "Release ${TAG} does not exist; need build"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            n="$(printf '%s' "$rel_json" | jq -r '.assets | length')"
            if [ "$n" -gt 0 ]; then
              echo "::notice::Release ${TAG} already has ${n} uploaded asset(s); version frozen, nothing to build. Bump APP_VERSION in .env.github to ship new code, or dispatch with force=true"
              echo "need_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release ${TAG} exists but has no uploaded assets; need build"
              echo "need_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  release:
    name: Build & publish signed Release APK
    needs: decide
    if: needs.decide.outputs.need_build == 'true'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.decide.outputs.version }}
      TAG: ${{ needs.decide.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (engines >= 22.11.0)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Setup JDK 17 (AGP 8.12)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure NDK 27.1.12297006 (ubuntu-latest fallback)
        run: |
          ndkpath="$ANDROID_HOME/ndk/27.1.12297006"
          if [ -d "$ndkpath" ]; then
            echo "Using preinstalled $ndkpath"
          else
            echo "Installing NDK from cmdline-tools ($ANDROID_HOME)"
            # `yes` + pipefail = SIGPIPE 141 trap; ignore. sdkmanager is idempotent.
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" || true
            [ -d "$ndkpath" ] || { echo "::error::NDK 27.1.12297006 not at $ndkpath after install attempt"; exit 1; }
          fi

      - name: Install deps (frozen lockfile)
        run: npm ci

      - name: Quality gate (rule 32 / AGENTS.md)
        run: |
          npm run lint
          npm run tsc

      - name: Stamp APP_BUILD_AT (UTC now) into .env.github before gradle reads it
        run: |
          set -euo pipefail
          sed -i "s/^APP_BUILD_AT=.*/APP_BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)/" .env.github

      - name: Materialize release.keystore (gitignored) under android/app/
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Write android/key.properties (gitignored; storeFile = android/app/release.keystore)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret must be set in GitHub repo settings."
            exit 1
          fi
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KS_PASS" > android/key.properties
          echo "Configured key.properties; storeFile path relative to android/app."

      - name: Build signed github-flavor APK (android/app -> assembleGithubRelease, arm64-v8a)
        env:
          # Narrow native compilation to arm64-v8a only (flavor ndk.abiFilters only filters
          # packaging; the ABI list for CMake build tasks comes from reactNativeArchitectures).
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: npm run build:apk

      - name: Verify APK signature (must be release-signed, not debug)
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/github/release/app-github-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::APK expected at $apk not found"
            ls -l android/app/build/outputs/apk/github/release/ 2>&1 || true
            exit 1
          fi
          # minSdk 26 ⇒ only v2/v3, so keytool -printcert -jarfile shows nothing. Use apksigner from build-tools.
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$AS" ]; then
            echo "WARN: apksigner not found under \$ANDROID_HOME/build-tools; skip signature print"
          else
            "$AS" verify --print-certs "$apk"
          fi

      - name: Publish GitHub release (create if missing) and upload APK asset
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/github/release/app-github-release.apk"
          # Rule 32: artifact naming follows dotenv APP_NAME (single source of truth)
          app_name="$(sed -n -e 's/^APP_NAME=//p' .env.github)"
          app_name="${app_name:-CafebeeAI}"
          renamed="${app_name}-${VERSION}-arm64-v8a.apk"
          cp "$apk" "$renamed"

          rel_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [ -n "$rel_json" ]; then
            echo "Release ${TAG} already exists; uploading asset (state, incl. draft/prerelease, preserved)"
            existing_sha="$(printf '%s' "$rel_json" | jq -r .target_commitish)"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "::warning::Release ${TAG} targets commit $existing_sha; uploading APK built from $GITHUB_SHA"
            fi
            gh release upload "$TAG" "$renamed" --clobber
            echo
            echo "Final release:"
            gh release view "$TAG"
            exit 0
          fi

          # Release missing: create it. If the git tag already exists (orphan tag), the
          # release is attached to that tag and the mismatch is only warned about.
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" -q .object.sha 2>/dev/null)"; then
            peeled="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" -q .object.sha 2>/dev/null || true)"
            [ -n "$peeled" ] && tag_sha="$peeled"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::warning::Tag ${TAG} exists (target $tag_sha) without a release; release will be created on that tag, APK built from $GITHUB_SHA"
            fi
            gh release create "$TAG" \
              --generate-notes \
              --title "${app_name} $VERSION" \
              --latest
          else
            gh release create "$TAG" \
              --generate-notes \
              --title "${app_name} $VERSION" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release upload "$TAG" "$renamed" --clobber
          echo
          echo "Final release:"
          gh release view "$TAG"
