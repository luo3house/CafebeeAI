name: Quick Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: lint + tsc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no history)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps (frozen lockfile)
        run: npm ci
      - run: npm run lint
      - run: npm run tsc
